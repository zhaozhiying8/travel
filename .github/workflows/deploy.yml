name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Debug Token
        run: |
          echo "=== Token Debug ==="
          echo "Token prefix: ${VERCEL_TOKEN:0:15}..."
          echo "Token length: ${#VERCEL_TOKEN}"
          if [[ "$VERCEL_TOKEN" == vercel_* ]]; then
            echo "Token type: Personal Token"
          elif [[ "$VERCEL_TOKEN" == vcp_* ]]; then
            echo "Token type: Project Token - THIS WON'T WORK FOR DEPLOYMENT!"
          else
            echo "Token type: Unknown"
          fi
          echo "==================="
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy to Vercel
        run: |
          echo "Starting deployment..."
          cd dist
          echo "Attempting: vercel deploy --prod --yes"
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo "Deploy exit code: $?"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
